<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="植物幸存者 Plant Survivors — 移动端花园生存游戏：豌豆射手自动攻击僵尸，活过三分钟击败巨人领主">
  <title>植物幸存者 Plant Survivors</title>
  <desc>移动端花园生存游戏：拖动走位，植物自动攻击，26 种植物、15 类敌人、三位主角。</desc>

  <rect width="1200" height="420" rx="20" fill="#1D3A24"/>
  <!-- grass blades, background -->
  <g stroke="#2E5A33" stroke-width="4" stroke-linecap="round">
    <path d="M 80 400 L 88 372 L 96 400"/>
    <path d="M 150 402 L 158 378 L 166 402"/>
    <path d="M 560 400 L 568 374 L 576 400"/>
    <path d="M 620 402 L 628 380 L 636 402"/>
  </g>
  <!-- sun -->
  <g>
    <circle cx="596" cy="66" r="26" fill="#F5C64B"/>
    <g stroke="#F5C64B" stroke-width="5" stroke-linecap="round">
      <path d="M 596 26 L 596 14"/><path d="M 596 106 L 596 118"/>
      <path d="M 556 66 L 544 66"/><path d="M 636 66 L 648 66"/>
      <path d="M 568 38 L 560 30"/><path d="M 624 38 L 632 30"/>
      <path d="M 568 94 L 560 102"/><path d="M 624 94 L 632 102"/>
    </g>
  </g>

  <!-- left copy -->
  <text x="64" y="92" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600" letter-spacing="4" fill="#F5C64B">移动端花园生存游戏</text>
  <text x="62" y="168" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="66" font-weight="700" fill="#FFFFFF">植物幸存者</text>
  <text x="64" y="208" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="600" letter-spacing="5" fill="#B7D3AE">PLANT SURVIVORS</text>
  <text x="64" y="260" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#E4EFE0">拖动走位、植物自动攻击，活过三分钟</text>
  <text x="64" y="294" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#B7D3AE">击败巨人领主，解锁更多植物与永久成长</text>

  <!-- badges -->
  <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="600">
    <rect x="64" y="322" width="92" height="36" rx="18" fill="#7CB342"/>
    <text x="110" y="346" text-anchor="middle" fill="#12240F">v0.9.0</text>
    <rect x="168" y="322" width="108" height="36" rx="18" fill="#16290F" stroke="#4A7A3F" stroke-width="1.5"/>
    <text x="222" y="346" text-anchor="middle" fill="#E4EFE0">26 植物</text>
    <rect x="288" y="322" width="108" height="36" rx="18" fill="#16290F" stroke="#4A7A3F" stroke-width="1.5"/>
    <text x="342" y="346" text-anchor="middle" fill="#E4EFE0">15 敌人</text>
    <rect x="408" y="322" width="108" height="36" rx="18" fill="#16290F" stroke="#4A7A3F" stroke-width="1.5"/>
    <text x="462" y="346" text-anchor="middle" fill="#E4EFE0">3 位主角</text>
  </g>

  <!-- right: battle scene -->
  <g id="battle">
    <rect x="660" y="48" width="476" height="324" rx="16" fill="#2E6B34"/>
    <rect x="660" y="48" width="476" height="324" rx="16" fill="none" stroke="#4A8A4F" stroke-width="1.5"/>
    <!-- grass tufts -->
    <g fill="#357A3C">
      <ellipse cx="720" cy="330" rx="26" ry="8"/>
      <ellipse cx="900" cy="352" rx="30" ry="8"/>
      <ellipse cx="1080" cy="330" rx="26" ry="8"/>
      <ellipse cx="800" cy="120" rx="24" ry="7"/>
      <ellipse cx="1060" cy="110" rx="24" ry="7"/>
    </g>
    <!-- boss hp bar -->
    <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
      <text x="898" y="84" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">最终 Boss · 巨人领主</text>
    </g>
    <line x1="708" y1="101" x2="1088" y2="101" stroke="#1D3A24" stroke-width="10" stroke-linecap="round"/>
    <line x1="708" y1="101" x2="968" y2="101" stroke="#E4573D" stroke-width="10" stroke-linecap="round"/>
    <!-- hero: dave cart + plants -->
    <g>
      <!-- cart -->
      <rect x="700" y="226" width="86" height="52" rx="8" fill="#8A5A2B"/>
      <rect x="700" y="226" width="86" height="14" rx="7" fill="#A9743A"/>
      <circle cx="722" cy="282" r="12" fill="#5C3A17"/>
      <circle cx="722" cy="282" r="5" fill="#C9A06A"/>
      <circle cx="764" cy="282" r="12" fill="#5C3A17"/>
      <circle cx="764" cy="282" r="5" fill="#C9A06A"/>
      <!-- pea shooter -->
      <circle cx="728" cy="196" r="22" fill="#7CB342"/>
      <circle cx="728" cy="196" r="22" fill="none" stroke="#558B2F" stroke-width="3"/>
      <ellipse cx="748" cy="198" rx="12" ry="9" fill="#7CB342" stroke="#558B2F" stroke-width="3"/>
      <circle cx="722" cy="190" r="3.5" fill="#12240F"/>
      <circle cx="734" cy="190" r="3.5" fill="#12240F"/>
      <!-- sunflower -->
      <circle cx="776" cy="200" r="18" fill="#F5C64B"/>
      <circle cx="776" cy="200" r="9" fill="#B07A1E"/>
      <circle cx="772" cy="197" r="2.5" fill="#12240F"/>
      <circle cx="780" cy="197" r="2.5" fill="#12240F"/>
    </g>
    <!-- peas flying -->
    <g fill="#9CCC65">
      <circle cx="830" cy="190" r="9"/>
      <circle cx="878" cy="182" r="9"/>
      <circle cx="926" cy="196" r="9"/>
    </g>
    <g stroke="#9CCC65" stroke-width="4" stroke-linecap="round" opacity="0.6">
      <path d="M 812 190 L 800 190"/>
      <path d="M 860 182 L 848 182"/>
      <path d="M 908 196 L 896 196"/>
    </g>
    <!-- zombie -->
    <g>
      <ellipse cx="1030" cy="300" rx="46" ry="10" fill="#26592B"/>
      <path d="M 1026 170 h 8 a 30 30 0 0 1 30 30 v 60 a 30 30 0 0 1 -30 30 h -8 a 30 30 0 0 1 -30 -30 v -60 a 30 30 0 0 1 30 -30 Z" fill="#8FA98F"/>
      <path d="M 1026 170 h 8 a 30 30 0 0 1 30 30 v 60 a 30 30 0 0 1 -30 30 h -8 a 30 30 0 0 1 -30 -30 v -60 a 30 30 0 0 1 30 -30 Z" fill="none" stroke="#6E8F6E" stroke-width="3"/>
      <circle cx="1018" cy="206" r="7" fill="#FFFFFF"/>
      <circle cx="1018" cy="206" r="3.5" fill="#12240F"/>
      <circle cx="1044" cy="206" r="7" fill="#FFFFFF"/>
      <circle cx="1044" cy="206" r="3.5" fill="#12240F"/>
      <path d="M 1014 236 Q 1030 246 1046 236" fill="none" stroke="#4A5D4A" stroke-width="4" stroke-linecap="round"/>
      <path d="M 996 226 L 972 250" stroke="#8FA98F" stroke-width="14" stroke-linecap="round"/>
      <path d="M 1064 226 L 1088 250" stroke="#8FA98F" stroke-width="14" stroke-linecap="round"/>
      <text x="1030" y="158" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">-36</text>
    </g>
    <!-- bottom hud -->
    <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
      <text x="688" y="352" font-size="18" fill="#D5E8D0">Lv.1</text>
      <text x="1108" y="352" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="end">02:15 / 03:00</text>
    </g>
    <line x1="736" y1="344" x2="980" y2="344" stroke="#1D3A24" stroke-width="8" stroke-linecap="round"/>
    <line x1="736" y1="344" x2="919" y2="344" stroke="#F5C64B" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
